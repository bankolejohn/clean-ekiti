name: Deploy to EC2 (Simple)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        #NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          
          echo "=== Starting Deployment ==="
          echo "Current directory: $(pwd)"
          echo "User: $(whoami)"
          
          # Check if directory exists, if not clone the repo
          if [ ! -d "/home/ubuntu/cleanekiti-mvp" ]; then
            echo "Directory not found. Cloning repository..."
            cd /home/ubuntu
            git clone https://github.com/${{ github.repository }}.git cleanekiti-mvp
          fi
          
          cd /home/ubuntu/cleanekiti-mvp
          echo "Changed to: $(pwd)"
          
          # Pull latest code
          echo "Pulling latest code from ${{ github.ref_name }}..."
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # Create .env.local
          echo "Creating .env.local file..."
          cat > .env.local << EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=production
          EOF
          
          echo "Environment file created"
          
          # Install dependencies
          echo "Installing dependencies..."
          npm ci --production=false
          
          # Build application
          echo "Building application..."
          npm run build
          
          # Check if PM2 is installed
          if ! command -v pm2 &> /dev/null; then
            echo "PM2 not found. Installing..."
            sudo npm install -g pm2
          fi
          
          # Restart or start PM2
          echo "Managing PM2 process..."
          if pm2 describe cleanekiti > /dev/null 2>&1; then
            echo "Restarting existing PM2 process..."
            pm2 restart cleanekiti
          else
            echo "Starting new PM2 process..."
            pm2 start npm --name "cleanekiti" -- start
          fi
          
          # Save PM2 configuration
          pm2 save
          
          # Show PM2 status
          echo "=== PM2 Status ==="
          pm2 list
          
          # Health check
          echo "=== Health Check ==="
          sleep 10
          if curl -f http://localhost:3000/ > /dev/null 2>&1; then
            echo "✅ Application is running successfully!"
          else
            echo "⚠️ Warning: Health check failed"
            pm2 logs cleanekiti --lines 20 --nostream
          fi
          
          echo "=== Deployment Complete ==="

    - name: Status
      if: always()
      run: |
        echo "Deployment ${{ job.status }}"
