name: Deploy to EC2 (Simple)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        #NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          
          echo "=== Starting Deployment ==="
          echo "Current directory: $(pwd)"
          echo "User: $(whoami)"
          
          # Check if directory exists and is a valid git repo
          if [ ! -d "/home/ubuntu/clean-ekiti/.git" ]; then
            echo "Git repository not found. Setting up fresh clone..."
            cd /home/ubuntu
            rm -rf clean-ekiti
            git clone https://github.com/${{ github.repository }}.git clean-ekiti
          fi
          
          cd /home/ubuntu/clean-ekiti
          echo "Changed to: $(pwd)"
          
          # Pull latest code
          echo "Pulling latest code from ${{ github.ref_name }}..."
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # Create .env.local without leading spaces
          echo "Creating .env.local file..."
          cat > .env.local <<ENVEOF
NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
JWT_SECRET=${{ secrets.JWT_SECRET }}
NODE_ENV=production
ENVEOF
          
          # Remove any leading/trailing spaces from the file
          sed -i 's/^[[:space:]]*//g' .env.local
          sed -i 's/[[:space:]]*$//g' .env.local
          
          echo "Environment file created and cleaned"
          echo "Variables count: $(grep -c "=" .env.local)"
          echo "First 3 lines (values hidden):"
          head -n 3 .env.local | sed 's/=.*/=***/'
          
          # Check if Node.js and npm are installed
          if ! command -v node &> /dev/null; then
            echo "Node.js not found. Installing Node.js 18..."
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          
          # Install dependencies
          echo "Installing dependencies..."
          npm ci --production=false
          
          # Build application
          echo "Building application..."
          npm run build
          
          # Check if PM2 is installed
          if ! command -v pm2 &> /dev/null; then
            echo "PM2 not found. Installing..."
            sudo npm install -g pm2
          fi
          
          # Configure Nginx if not already configured
          echo "Configuring Nginx..."
          if [ ! -f /etc/nginx/sites-available/cleanekiti ]; then
            sudo tee /etc/nginx/sites-available/cleanekiti > /dev/null << 'NGINX_EOF'
          server {
              listen 80;
              server_name _;
              client_max_body_size 10M;
          
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX_EOF
            sudo ln -sf /etc/nginx/sites-available/cleanekiti /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Nginx configured"
          else
            echo "✅ Nginx already configured"
          fi
          
          # Stop existing PM2 process to ensure clean restart
          echo "Managing PM2 process..."
          pm2 delete cleanekiti 2>/dev/null || true
          
          # Start PM2 with production mode
          echo "Starting application in production mode..."
          NODE_ENV=production pm2 start npm --name "cleanekiti" -- start
          
          # Save PM2 configuration
          pm2 save
          
          # Setup PM2 startup script
          sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true
          
          # Show PM2 status
          echo "=== PM2 Status ==="
          pm2 list
          pm2 info cleanekiti
          
          # Health check
          echo "=== Health Check ==="
          sleep 15
          if curl -f http://localhost:3000/ > /dev/null 2>&1; then
            echo "✅ Application is running successfully!"
            echo "✅ App accessible at: http://localhost:3000"
          else
            echo "⚠️ Warning: Health check failed"
            echo "=== Recent Logs ==="
            pm2 logs cleanekiti --lines 30 --nostream
          fi
          
          echo "=== Deployment Complete ==="

    - name: Status
      if: always()
      run: |
        echo "Deployment ${{ job.status }}"
