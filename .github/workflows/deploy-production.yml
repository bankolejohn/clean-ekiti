name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual deployment

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production  # Use GitHub Environment for production secrets
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        # Build-time environment variables
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}

    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          # Export environment variables
          export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          export SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          export CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          export CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}"
          export CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
          export MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}"
          export APP_URL="${{ secrets.PRODUCTION_APP_URL }}"
          export NODE_ENV="production"
          
          cd /var/www/cleanekiti
          
          # Backup current version
          cp -r .next .next.backup || true
          
          # Pull latest changes
          git pull origin main
          
          # Setup environment variables
          chmod +x scripts/setup-env.sh
          ./scripts/setup-env.sh
          
          # Install dependencies
          npm ci --production=false
          
          # Build application
          NODE_OPTIONS="--max-old-space-size=4096" npm run build
          
          # Restart application with zero-downtime
          PORT=3000 pm2 reload cleanekiti --update-env || PORT=3000 pm2 start npm --name "cleanekiti" -- start
          
          # Wait for application to start
          sleep 20
          
          # Health check with retries
          for i in {1..10}; do
            if curl -f http://localhost:3000/api/health; then
              echo "✅ Health check passed on attempt $i"
              break
            else
              echo "⏳ Health check failed, attempt $i/10, retrying in 5s..."
              sleep 5
              if [ $i -eq 10 ]; then
                echo "❌ Health check failed after 10 attempts"
                # Rollback to backup
                rm -rf .next
                mv .next.backup .next
                pm2 restart cleanekiti
                exit 1
              fi
            fi
          done
          
          # Cleanup backup
          rm -rf .next.backup
          
          echo "✅ Production deployment successful!"

    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "🚀 Production deployment successful!"
          echo "🌐 Production URL: ${{ secrets.PRODUCTION_APP_URL }}"
        else
          echo "❌ Production deployment failed!"
        fi
