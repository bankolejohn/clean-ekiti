name: Deploy to EC2

on:
  push:
    branches: [ main ]  # Deploy when pushing to main or develop
  workflow_dispatch:  # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        # Build-time environment variables
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}

    - name: Deploy to EC2 Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        script: |
          # Export environment variables for the script
          export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          export SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          export CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          export CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}"
          export CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
          export MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}"
          export APP_URL="${{ secrets.APP_URL }}"
          export NODE_ENV="production"
          
          # Navigate to app directory
          cd ${{ secrets.APP_DIRECTORY || '/home/ubuntu/cleanekiti-mvp' }}
          
          # Backup current version
          cp -r .next .next.backup 2>/dev/null || true
          
          # Pull latest changes
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # Setup environment variables
          chmod +x scripts/setup-env.sh
          ./scripts/setup-env.sh
          
          # Install dependencies
          npm ci
          
          # Build application
          NODE_OPTIONS="--max-old-space-size=2048" npm run build
          
          # Restart application
          PORT=${{ secrets.APP_PORT || 3000 }} pm2 restart cleanekiti || PORT=${{ secrets.APP_PORT || 3000 }} pm2 start npm --name "cleanekiti" -- start
          
          # Wait for application to start
          sleep 15
          
          # Health check
          for i in {1..5}; do
            if curl -f http://localhost:${{ secrets.APP_PORT || 3000 }}/api/health 2>/dev/null || curl -f http://localhost:${{ secrets.APP_PORT || 3000 }}/ 2>/dev/null; then
              echo "✅ Health check passed on attempt $i"
              rm -rf .next.backup
              exit 0
            else
              echo "⏳ Health check failed, attempt $i/5, retrying in 5s..."
              sleep 5
            fi
          done
          
          # If we get here, health check failed
          echo "❌ Health check failed after 5 attempts"
          echo "🔄 Rolling back to previous version..."
          rm -rf .next
          mv .next.backup .next 2>/dev/null || true
          pm2 restart cleanekiti
          exit 1

    - name: Deployment Summary
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment successful!"
          echo "🌐 App URL: ${{ secrets.APP_URL }}"
          echo "📝 Branch: ${{ github.ref_name }}"
          echo "📦 Commit: ${{ github.sha }}"
        else
          echo "❌ Deployment failed!"
          echo "Check the logs above for details"
        fi
